$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: https://raw.githubusercontent.com/shreyashsaitwal/rush-cli/main/schema/rush.yml

title: Rush configuration
description: Configuration of a Rush extension project (rush.yml).

type: object
additionalProperties: false
required:
  - version

properties:
  version:
    description: Version name of the extension, e.g. `1.2.0`.
    type: string

  min_sdk:
    description: Minimum Android API level the extension supports.
    type: integer
    minimum: 7
    default: 7

  homepage:
    description: URL of the extension's homepage or documentation.
    type: string

  license:
    description: Path to the extension's license file, or a URL to it.
    type: string

  authors:
    description: Deprecated and ignored.
    type: array
    items:
      type: string
    deprecated: true

  assets:
    description: Files in the `assets` directory to bundle with the extension.
    type: array
    items:
      type: string

  dependencies:
    description: |
      Libraries bundled with the extension: Maven coordinates
      (`group:artifact:version`), or JAR/AAR files in the `deps` directory.
      AARs are shipped as-is, so their resources are available at runtime.
    type: array
    items:
      type: string

  provided_dependencies:
    description: |
      Deprecated: list these libraries in `dependencies` and place them as
      `provided` under `libraries` (`rush migrate` does it).
    deprecated: true
    type: array
    items:
      type: string

  libraries:
    description: |
      Where a library goes, overriding Rush's own choice. Keys are
      `group:artifact` without a version, or the file name of a JAR/AAR in the
      `deps` directory.
    type: object
    propertyNames:
      pattern: '^([^:\s]+:[^:\s]+|[^:\s/]+\.(jar|aar))$'
    additionalProperties:
      oneOf:
        - const: exclude
          description: Not resolved at all, nor what only it needs.
        - const: provided
          description: Compiled against but not shipped, nor what only it needs.
        - const: shared
          description: |
            Shipped unchanged; App Inventor keeps one copy for every extension
            in the app.
        - const: private
          description: The extension's own copy, relocated under its package.

  original_names:
    description: |
      Packages whose classes keep their original names in every private
      library, for code that finds them by name outside the bytecode, such as
      native libraries.
    type: array
    items:
      type: string
      pattern: '^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*$'

  repositories:
    description: |
      Additional Maven repositories to resolve dependencies from. Maven Central
      and Google's Maven repository are always included.
    type: array
    items:
      type: string
      format: uri

  kotlin:
    description: Kotlin compiler configuration.
    type: object
    additionalProperties: false
    required:
      - compiler_version
    properties:
      compiler_version:
        description: Version of the Kotlin compiler, e.g. `2.4.20`.
        type: string

  desugar:
    description: Deprecated and ignored; Java 8+ features are always desugared.
    type: boolean
    deprecated: true
