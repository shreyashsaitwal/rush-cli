name: Rush CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  processor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build processor and annotations
        working-directory: processor
        run: ./gradlew build :processor:shadowJar
      - name: Collect JARs
        run: |
          mkdir libs
          cp processor/processor/build/libs/processor-*[0-9].jar libs/processor.jar
          cp processor/annotations/build/libs/annotations-*[0-9].jar libs/annotations.jar
      - uses: actions/upload-artifact@v4
        with:
          name: libs
          path: libs/
          if-no-files-found: error

  maven-resolver:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/maven_resolver
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get
      - run: dart format -o none --set-exit-if-changed lib test
      - run: dart analyze --fatal-warnings
      - run: dart test

  cli:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux
          - os: windows-2025
            target: x86_64-windows
          - os: macos-15
            target: arm64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: dart pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format -o none --set-exit-if-changed bin lib
      - run: dart analyze --fatal-warnings bin lib
      - name: Build executable
        shell: bash
        run: |
          mkdir -p dist/bin
          if [ "$RUNNER_OS" = "Windows" ]; then exe=rush.exe; else exe=rush; fi
          dart compile exe -o "dist/bin/$exe" bin/rush.dart
      - uses: actions/upload-artifact@v4
        with:
          name: rush-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [processor, maven-resolver, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create platform archives
        run: |
          mkdir archives
          for target in x86_64-linux x86_64-windows arm64-apple-darwin x86_64-apple-darwin; do
            cp -r libs "rush-$target/libs"
            chmod +x rush-$target/bin/* || true
            (cd "rush-$target" && zip -r9 "../archives/rush-$target.zip" .)
          done
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: archives/*.zip
